# deploy/k8s/erp-deployment.yaml — PHASE 9 (14.4)
# Kubernetes manifests for the ERP production deployment.
# Probe paths are aligned with src/app.ts: /health/live, /health/ready, /health/startup.
#
# Create the secret before first apply:
#   kubectl create secret generic erp-secrets \
#     --from-literal=database-url="$DATABASE_URL" \
#     --from-literal=jwt-secret="$JWT_SECRET" \
#     --from-literal=allowed-origins="$ALLOWED_ORIGINS" \
#     --from-literal=erp-setup-token="$ERP_SETUP_TOKEN" \
#     --from-literal=erp-webhook-secret-token="$ERP_WEBHOOK_SECRET_TOKEN"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp
  labels:
    app: erp
spec:
  # v7.0.44 (تصمیم مالک محصول): سامانه تک‌نمونه‌ای است (یک کارگاه، حداکثر ۲۰ کاربر همزمان).
  # کش‌های درون‌حافظه‌ای، محدودکننده‌های نرخ و قفل‌های فرایندی برای یک پردازه طراحی شده‌اند؛
  # Recreate تضمین می‌کند حتی هنگام به‌روزرسانی هم دو پردازه همزمان اجرا نشوند (چند replica پشتیبانی نمی‌شود).
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: erp
  template:
    metadata:
      labels:
        app: erp
    spec:
      # V3.0.8 (TD-058): stateful path ها به volume منتقل شدند (داده تصاویر با از بین رفتن pod زنده می‌ماند).
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: erp-uploads
      - name: logs
        emptyDir: {}
      containers:
      - name: erp
        image: registry.example.com/erp:v10.0.17
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: uploads
          mountPath: /app/public/uploads
        - name: logs
          mountPath: /app/logs
        env:
        - name: NODE_ENV
          value: "production"
        - name: APP_VERSION
          value: "10.0.17"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: jwt-secret
        - name: ALLOWED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: allowed-origins
        # v7.0.23 (TD-181): Ingress controllers live in cluster-private ranges; trust them for the real client IP
        - name: TRUST_PROXY
          value: "loopback, linklocal, uniquelocal"
        - name: ERP_SETUP_TOKEN
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: erp-setup-token
        - name: ERP_WEBHOOK_SECRET_TOKEN
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: erp-webhook-secret-token
        # v7.0.139 (TD-189): کلید رمزنگاری رمزهای شخص ثالث (رمز نوبیتکس پرسنل)
        - name: ERP_SECRETS_KEY
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: erp-secrets-key
        # ... سایر env vars طبق .env.production.example
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /health/startup
            port: 3000
          failureThreshold: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: erp
spec:
  selector:
    app: erp
  ports:
  - port: 80
    targetPort: 3000
---
# V3.0.8 (TD-058): PersistentVolumeClaim برای فایل‌های بارگذاری‌شده (تصاویر و پیوست‌ها).
# v7.0.44: با یک نمونه، ReadWriteOnce کافی است.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erp-uploads
  labels:
    app: erp
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: <StorageClass مورد نظر>
