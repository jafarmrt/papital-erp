# .github/workflows/ci.yml — Papital ERP GitHub Actions CI/CD Pipeline (v7.0.19 / TD-172: lockfile + Node 22 + blocking audit gate)
# Multi-stage CI: lint-and-typecheck (+version-sync) → database-integration-tests → coverage-soft-gate (non-blocking) → client-server-build → docker-build-gate
#
# Environment & Secrets:
#   DATABASE_URL: Service container PostgreSQL 16
#   JWT_SECRET, ERP_SETUP_TOKEN, METRICS_TOKEN: Test credentials
#   REGISTRY_USER / REGISTRY_TOKEN: Optional container registry credentials

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, staging, 'release/**']
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify package-lock.json Presence (TD-129)
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required for deterministic reproducible CI builds."
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit Gate (High/Critical CVEs — TD-172)
        # fail-fast؛ استثناها فقط با ردیف باز در TECH_DEBT.md (scripts/audit-gate.ts)
        run: npm run audit:gate

      - name: TD-111 Version Sync Gate (fail-fast)
        run: npm run check:version

      - name: TypeScript Static Type Checking & Linting
        run: npm run lint

  test:
    name: Database & Domain Test Suites
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Full 21-Suite Test Matrix
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/erp_test
          JWT_SECRET: test-jwt-secret-at-least-32-characters-long-1234
          ERP_SETUP_TOKEN: test_setup_token_at_least_16_chars_long
          METRICS_TOKEN: test_metrics_token_for_ci_pipeline_1234
          NODE_ENV: test
          ERP_ALLOW_TEST_CLEANUP: '1'
          ERP_TEST_SCHEMA_ISOLATION: '1'
          PORT: 3000
        run: npm test

      - name: Publish Test Job Summary
        if: always()
        run: |
          echo "### 🧪 ERP Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Outcome:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Database Engine:** PostgreSQL 16 Service Container" >> $GITHUB_STEP_SUMMARY

  coverage-gate:
    name: Code Coverage Hard Gate (TD-129)
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Test Matrix Under c8 Coverage
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/erp_test
          JWT_SECRET: test-jwt-secret-at-least-32-characters-long-1234
          ERP_SETUP_TOKEN: test_setup_token_at_least_16_chars_long
          METRICS_TOKEN: test_metrics_token_for_ci_pipeline_1234
          NODE_ENV: test
          ERP_ALLOW_TEST_CLEANUP: '1'
          ERP_TEST_SCHEMA_ISOLATION: '1'
          PORT: 3000
        run: npm run test:coverage

      - name: Publish Coverage Report to Step Summary
        if: always()
        run: |
          echo "### 📊 Coverage Report (Hard Gate — V7 Quality Standard)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json')['total'];
              const pct = (k) => s[k] ? s[k].pct + '%' : 'n/a';
              console.log('Lines      : ' + pct('lines'));
              console.log('Statements : ' + pct('statements'));
              console.log('Functions  : ' + pct('functions'));
              console.log('Branches   : ' + pct('branches'));
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "coverage-summary.json not produced — review c8 run logs." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  build:
    name: Client & Server Production Build
    needs: [test, coverage-gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging' || github.event_name == 'pull_request'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application (Vite Client + CJS Server Bundle + Drizzle Migrations)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  docker-gate:
    name: Docker Container Build Verification
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Resolve Application Version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "IMAGE_TAG=v${APP_VERSION}" >> $GITHUB_ENV

      - name: Verify Docker Image Build
        run: docker build -t papital-erp:${IMAGE_TAG} .

      - name: Runtime Module Resolution Smoke Test (TD-175)
        # باندل سرور با --packages=external ساخته می‌شود؛ هر پکیجی که در رانتایم require می‌شود
        # باید در node_modules ایمیج نهایی قابل resolve باشد (جلوگیری از کرش «Cannot find module»).
        run: |
          docker run --rm --entrypoint node papital-erp:${IMAGE_TAG} -e "
            const fs = require('fs');
            const builtin = new Set(require('module').builtinModules);
            const src = fs.readFileSync('dist/server.cjs', 'utf8');
            const mods = [...new Set([...src.matchAll(/require\(\"([^\".][^\"]*)\"\)/g)].map(m => m[1]))]
              .filter(m => !m.startsWith('node:') && !builtin.has(m.split('/')[0]));
            const missing = mods.filter(m => { try { require.resolve(m, { paths: ['/app'] }); return false; } catch { return true; } });
            if (missing.length) { console.error('Missing runtime modules:', missing.join(', ')); process.exit(1); }
            console.log('All ' + mods.length + ' runtime modules resolvable');
          "

      - name: Push Container Image (Conditional on Registry Secrets)
        # v7.0.19 (TD-172): کانتکست secrets در شرط if مجاز نیست و کل workflow را نامعتبر می‌کرد؛
        # بررسی وجود اعتبارنامه‌ها به داخل اسکریپت منتقل شد.
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY || 'registry.example.com' }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
        run: |
          if [ -z "${REGISTRY_TOKEN}" ] || [ -z "${REGISTRY_USER}" ]; then
            echo "Registry credentials not configured — skipping image push."
            exit 0
          fi
          echo "${REGISTRY_TOKEN}" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker tag papital-erp:${IMAGE_TAG} "${REGISTRY}/erp:${IMAGE_TAG}"
          docker push "${REGISTRY}/erp:${IMAGE_TAG}"

  deploy-staging:
    name: Deploy to Staging Environment
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - name: Trigger Staging Deployment
        run: |
          echo "Triggering automated staging deployment for commit ${{ github.sha }}..."

  smoke-test-staging:
    name: Staging Post-Deployment Smoke Tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Smoke Tests Against Staging Cluster
        env:
          ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "${ADMIN_TOKEN}" ]; then
            echo "STAGING_ADMIN_TOKEN not configured — skipping staging smoke tests."
            exit 0
          fi
          bash scripts/smoke-test.sh https://staging.erp.example.com
