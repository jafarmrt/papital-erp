# .github/workflows/ci.yml — PHASE 9 (14.5) CI/CD Pipeline Skeleton
# test → build → deploy-staging → smoke-test-staging
#
# Required repository secrets:
#   REGISTRY_USER / REGISTRY_TOKEN  — container registry credentials (once a Dockerfile exists)
#   STAGING_ADMIN_TOKEN             — auth_token cookie value for staging smoke tests
name: CI/CD Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Install
      run: npm ci
    - name: Lint & type check (tsc --noEmit)
      run: npm run lint
    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:test@localhost:5432/erp_test
        JWT_SECRET: test-jwt-secret-at-least-32-characters-long-1234
        NODE_ENV: test
      run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - run: npm ci
    - name: Build (vite client + esbuild server bundle)
      run: npm run build
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ github.sha }}
        path: dist/

  # V3.0.8 (TD-058): Docker build/push — the image is built on every master push as a
  # build verification gate; it is pushed only when registry secrets are configured.
  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v4
    - name: Set image version
      run: echo "IMAGE_TAG=v$(node -p "require('./package.json').version")" >> $GITHUB_ENV
    - name: Build Docker image
      run: docker build -t papital-erp:${IMAGE_TAG} .
    - name: Push to registry (only when secrets are configured)
      if: ${{ secrets.REGISTRY_TOKEN != '' }}
      env:
        REGISTRY: ${{ vars.DOCKER_REGISTRY || 'registry.example.com' }}
        REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      run: |
        echo "${REGISTRY_TOKEN}" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
        docker tag papital-erp:${IMAGE_TAG} "${REGISTRY}/erp:${IMAGE_TAG}"
        docker push "${REGISTRY}/erp:${IMAGE_TAG}"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
    - name: Deploy to staging
      run: |
        # trigger deployment to staging
        # e.g., kubectl set image deployment/erp erp=registry.example.com/erp:${{ github.sha }}
        echo "Deploy to staging"

  smoke-test-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run smoke tests
      env:
        ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
      run: |
        bash scripts/smoke-test.sh https://staging.erp.example.com
