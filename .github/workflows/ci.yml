# Scratch branch only (v11 phase 5.5): rehearses the owner's next update on a simulated root install. Never merged.
name: CI
on:
  workflow_dispatch:

jobs:
  rehearsal:
    name: Update Rehearsal On A Root Install (v11.3.0 to this release)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: A Git Remote At v11.3.0 And A Root Clone In /opt/papital-erp
        run: |
          sudo git config --system --add safe.directory '*'
          git clone --bare . "$RUNNER_TEMP/remote.git"
          git -C "$RUNNER_TEMP/remote.git" update-ref refs/heads/master 01fad272dc412631f76aa439e8c722bfeb93ae04
          git -C "$RUNNER_TEMP/remote.git" symbolic-ref HEAD refs/heads/master
          sudo git clone --branch master "$RUNNER_TEMP/remote.git" /opt/papital-erp
          sudo git -C /opt/papital-erp log --oneline -1

      - name: Install v11.3.0 As Root (the owner's layout)
        working-directory: /opt/papital-erp
        run: |
          sudo bash install.sh
          test -z "$(systemctl show -p User --value papital-erp)" || test "$(systemctl show -p User --value papital-erp)" = root
          curl -fsS http://localhost:3000/health/ready

      - name: Make It Look Like The Owner's Server (older cron file, .env without METRICS_TOKEN, one daily backup)
        working-directory: /opt/papital-erp
        run: |
          sudo sed -i '/^METRICS_TOKEN=/d' .env
          printf '%s\n' 'SHELL=/bin/bash' \
            '15 1 * * * root /opt/papital-erp/scripts/backup.sh >> /opt/papital-erp/logs/backup.log 2>&1' \
            '*/5 * * * * root /opt/papital-erp/scripts/monitor.sh >> /opt/papital-erp/logs/monitor.log 2>&1' \
            | sudo tee /etc/cron.d/papital-erp >/dev/null
          sudo bash scripts/backup.sh
          sudo ls -l /var/backups/erp

      - name: The Release Arrives On The Remote
        run: git push "$RUNNER_TEMP/remote.git" HEAD~1:refs/heads/master

      - name: sudo ./update.sh (the old update.sh pulls, then the new one finishes)
        working-directory: /opt/papital-erp
        run: |
          sudo ./update.sh 2>&1 | tee "$RUNNER_TEMP/update1.log"
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'Update finished successfully' "$RUNNER_TEMP/update1.log"

      - name: Still Root, Keys Added, Cron Rewritten With Its Times
        working-directory: /opt/papital-erp
        run: |
          u="$(systemctl show -p User --value papital-erp)"; [ -z "$u" ] || [ "$u" = root ]
          sudo grep -qE '^METRICS_TOKEN=[0-9a-f]{64}$' .env
          [ "$(sudo grep -c '^ERP_WEBHOOK_SECRET_TOKEN=' .env)" -le 1 ]
          sudo cat /etc/cron.d/papital-erp
          grep -qF '15 1 * * * root bash /opt/papital-erp/scripts/backup.sh >> /opt/papital-erp/logs/backup.log 2>&1' /etc/cron.d/papital-erp
          grep -qF 'root bash /opt/papital-erp/scripts/nightly-verify.sh >> /opt/papital-erp/logs/nightly-verify.log 2>&1' /etc/cron.d/papital-erp
          if grep -q runuser /etc/cron.d/papital-erp; then echo "::error::a root install got the service-user cron line"; exit 1; fi
          test "$(sudo git -C /opt/papital-erp rev-parse HEAD)" = "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD~1)"
          curl -fsS http://localhost:3000/health/ready
          sudo stat -c '%U %a %n' .env logs /var/backups/erp

      - name: The Nightly Jobs Run As Before
        working-directory: /opt/papital-erp
        run: |
          sudo bash scripts/backup.sh
          sudo bash scripts/nightly-verify.sh
          sudo bash scripts/monitor.sh
          sudo ls -l /var/backups/erp logs

      - name: A Second Update With Nothing New Changes Nothing
        working-directory: /opt/papital-erp
        run: |
          before="$(systemctl show -p ExecMainStartTimestamp --value papital-erp)"
          sudo ./update.sh 2>&1 | tee "$RUNNER_TEMP/update2.log"
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'Nothing to update' "$RUNNER_TEMP/update2.log"
          test "$(systemctl show -p ExecMainStartTimestamp --value papital-erp)" = "$before"

      - name: Logs On Failure
        if: failure()
        run: |
          sudo journalctl -u papital-erp -n 200 --no-pager || true
          sudo tail -n 80 /opt/papital-erp/update-*.log 2>/dev/null || true
